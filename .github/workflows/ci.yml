name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Generate, build, test, and lint
        run: mise run all
      - name: Verify module metadata
        run: git diff --exit-code
      - name: Build Docker image through mise
        run: mise run image

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag on main
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: jdx/mise-action@v4
      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish Docker image through mise
        run: mise run image-push
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
