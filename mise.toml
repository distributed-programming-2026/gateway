[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
protoc = "36.2"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.0"

[tasks.all]
run = [
 { task = "generate" },
 { task = "modules" },
 { task = "build" },
 { task = "test" },
 { task = "integration-tests" },
 { task = "lint" },
]

[tasks.generate]
run = [ { task = "grpc-generate" }, { task = "oapi-generate" } ]

[tasks.grpc-generate]
run = """
protoc --proto_path=api \
 --go_out=. --go_opt=module=github.com/distributed-programming-2026/gateway \
 --go-grpc_out=. --go-grpc_opt=module=github.com/distributed-programming-2026/gateway \
 api/interceptorgrpc/interceptorgrpc.proto
"""

[tasks.oapi-generate]
run = "mkdir -p api/client/interceptorrest && oapi-codegen -package interceptorrest -generate types,client,spec -o api/client/interceptorrest/interceptorrest.gen.go api/interceptorrest/interceptorrest.oapi.yaml"

[tasks.modules]
depends = ["generate"]
run = "go mod tidy"

[tasks.build]
depends = ["generate"]
env = { GOOS = "linux", GOARCH = '{{ env.GOARCH | default(value="amd64") }}', CGO_ENABLED = "0" }
run = "go build -trimpath -o dist/gateway ./cmd"

[tasks.test]
depends = ["generate"]
run = "go test ./cmd ./internal/gateway/..."

[tasks.integration-tests]
depends = ["generate"]
run = "go test -race -count=1 ./internal/integration-tests"

[tasks.lint]
depends = ["generate"]
run = "golangci-lint run"

[tasks.coverage]
depends = ["generate"]
run = [
 "mkdir -p dist",
 "go test -race -count=1 -coverpkg=./internal/gateway/... -coverprofile=dist/coverage.out ./cmd ./internal/gateway/... ./internal/integration-tests",
 "go tool cover -func=dist/coverage.out",
 "go tool cover -html=dist/coverage.out -o dist/coverage.html",
]

[tasks.image]
description = "Build the Linux Docker image (IMAGE defaults to gateway:local)"
depends = ["build"]
run = 'docker build --platform "linux/${GOARCH:-amd64}" --tag "${IMAGE:-gateway:local}" .'

[tasks.image-push]
description = "Build and push the Docker image named by IMAGE"
depends = ["image"]
run = 'docker push "${IMAGE:?set IMAGE to the registry image and version}"'

[tasks.release]
description = "Check main and publish a version tag: mise run release -- v0.0.1"
run = "./mise-tasks/release"
